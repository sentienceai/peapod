    </div>
  </div>
</div>

      style: 'height: 30px; padding: 0 10px; border: 0; border-radius: 7px; font-size: 13px; font-weight: 500; ' + (st.sub === id ? 'background: var(--muted-bg); color: var(--fg);' : 'background: transparent; color: var(--muted);')
    }));

    const tGrid = 'minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1.1fr) 170px';
    const aGrid = 'minmax(0, 2fr) 104px minmax(0, 1fr) 84px 92px minmax(0, 0.9fr)';
    const grid = isTraders ? tGrid : aGrid;
    const headStyle = 'height: 34px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: grid; grid-template-columns: ' + grid + '; column-gap: 12px; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);';
    const hd = (label, right, sortable) => ({ label, sortable, style: 'display: flex; align-items: center; gap: 4px; justify-content: ' + (right ? 'flex-end' : 'flex-start') + ';' });
    const heads = isTraders
      ? [hd('Address', false, true), hd('7D PnL', true, true), hd('Portfolio', true, true), hd('Copy score', true, true)]
      : [hd('Asset', false, true), hd('Type', false, false), hd('Price', true, true), hd('24H', true, true), hd('Holders', true, true), hd('24H volume', true, false)];

    const rowStyle = (i) => 'width: 100%; height: 44px; box-sizing: border-box; padding: 0 20px; border: 0; background: ' + (i === active ? 'var(--muted-bg)' : 'transparent') + '; color: var(--fg); font: inherit; text-align: left; display: grid; grid-template-columns: ' + grid + '; column-gap: 12px; align-items: center;';
    const scoreColor = (s) => s >= 80 ? 'var(--up)' : s >= 50 ? 'var(--warn)' : 'var(--down)';
    const scoreFill = (s) => s >= 80 ? accent : s >= 50 ? '#E8A400' : '#E5532E';

    const traderRows = traderMatch.map((t, i) => {
      const bars = [];
      for (let b = 0; b < 10; b++) bars.push({ style: 'width: 3px; height: 14px; border-radius: 1px; display: block; background: ' + (b < Math.round(t.score / 10) ? scoreFill(t.score) : 'var(--line)') + ';' });
      const named = t.name.indexOf('0x') !== 0;
      const tag = COPYING.indexOf(t.name) >= 0 ? 'Copying' : TRACKED.indexOf(t.name) >= 0 ? 'Tracked' : '';
      const pnl7 = t.pnl * 0.31;
      return {
        name: named ? t.name : 'Wallet', short: shortAddr(t.addr),
        initials: named ? t.name.slice(0, 2).toUpperCase() : t.name.slice(2, 4).toUpperCase(),
        avatarStyle: 'width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; ' + (t.score >= 95 ? 'background: ' + accent + '; color: #0A0B09;' : 'background: var(--muted-bg); color: var(--fg); border: 1px solid var(--line); box-sizing: border-box;'),
        hasTag: !!tag, tag,
        pnl: (pnl7 >= 0 ? '+' : '') + fmtCompact(pnl7),
        pnlStyle: 'text-align: right; font-family: "JetBrains Mono", monospace; font-size: 13px; color: ' + (pnl7 >= 0 ? 'var(--up)' : 'var(--down)') + ';',
        value: '$' + Math.round(t.acct).toLocaleString('en-US') + '.00',
        score: String(t.score),
        scoreStyle: 'font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 600; color: ' + scoreColor(t.score) + ';',
        bars, style: rowStyle(i), open: () => openTrader(t)
      };
    });

    const assetRows = assetMatch.map((a, i) => ({
      sym: a.sym, name: a.name, type: a.type, letter: a.sym.charAt(0),
      iconStyle: 'width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: #0A0B09; background: ' + TYPE_BG[a.type] + ';',
      tagStyle: 'height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; ' + (a.type === 'Memecoin' ? 'background: var(--meme-bg); color: var(--meme);' : 'background: var(--muted-bg); color: var(--muted);'),
      price: fmtPrice(a.price),
      chg: (a.chg >= 0 ? '+' : '') + a.chg.toFixed(2) + '%',
      chgStyle: 'text-align: right; font-family: "JetBrains Mono", monospace; font-size: 13px; color: ' + (a.chg > 0 ? 'var(--up)' : a.chg < 0 ? 'var(--down)' : 'var(--muted)') + ';',
      holders: a.holders.toLocaleString('en-US'),
      vol: fmtCompact(a.vol),
      style: rowStyle(i), open: () => openAsset(a)
    }));

    const onKey = (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ active: Math.min(active + 1, list.length - 1) }); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ active: Math.max(active - 1, 0) }); }
      else if (e.key === 'Enter') { if (list[active]) { if (isTraders) openTrader(list[active]); else openAsset(list[active]); } }
      else if (e.key === 'Tab') { e.preventDefault(); switchTab(isTraders ? 'assets' : 'traders'); }
      else if (e.key === 'Escape') { close(); }
    };

    const K = (k) => ({ k });
    const hints = [
      { keys: [K('↑'), K('↓')], label: 'Navigate' },
      { keys: [K('↵')], label: 'Open' },
      { keys: [K('TAB')], label: 'Switch tab' },
      { keys: [K('ESC')], label: 'Close' }
    ];

    return Object.assign(this.themeVals(), {
      accent, q: st.q, close, onKey, tabs, subs, heads, headStyle,
      onQuery: (e) => {
        const v = e.target.value;
        const looksAsset = /^[a-z]{2,7}$/i.test(v.trim()) && ASSETS.some((a) => a.sym.toLowerCase().indexOf(v.trim().toLowerCase()) === 0) && !TRADERS.some((t) => t.name.toLowerCase().indexOf(v.trim().toLowerCase()) === 0);
        this.setState({ q: v, active: 0, tab: v.trim().indexOf('0x') === 0 ? 'traders' : looksAsset ? 'assets' : st.tab });
      },
      isTraders, isAssets: !isTraders,
      traderRows: isTraders ? traderRows : [], assetRows: isTraders ? [] : assetRows,
      isEmpty: list.length === 0,
      countLabel: list.length + (isTraders ? (list.length === 1 ? ' trader' : ' traders') : (list.length === 1 ? ' asset' : ' assets')),
      hints
    });
  }
}
</script>
</body>
</html>
