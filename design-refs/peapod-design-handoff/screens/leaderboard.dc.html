<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    .pp { --surface: #FFFFFF; --surface-2: #FAFBF9; --sunken: #F7F8F6; --hover: #F5F7F3; --muted-bg: #F2F4F0; --muted-bg-2: #EEF1EC; --grid: #F0F2EE; --line-soft: #EEF0EC; --line: #E6E9E3; --up-line: #E1F2E6; --line-strong: #D6DAD2; --line-strong-2: #C9CEC5; --faint: #B7BCB2; --subtle: #8A9082; --placeholder: #6B7166; --muted: #5F6559; --fg: #11140F; --fg-strong: #000000; --up: #067A2F; --down: #C8360F; --warn: #8A6100; --meme: #6D4FE0; --up-bg: #EAF8EE; --up-bg-2: #F3FBF5; --up-track: #C9E9D2; --down-bg: #FDECE7; --meme-bg: #F1EDFF; --inv-bg: #11140F; --inv-fg: #FFFFFF; --inv-hover: #2A2E25; color-scheme: light; color: var(--fg); transition: background-color 250ms ease, color 250ms ease; }
    .pp.theme-dark { --surface: #111310; --surface-2: #161914; --sunken: #0B0C0A; --hover: #1A1D17; --muted-bg: #1C1F19; --muted-bg-2: #20241D; --grid: #161914; --line-soft: #1E221B; --line: #272B23; --up-line: #1C3323; --line-strong: #394033; --line-strong-2: #4A5143; --faint: #596052; --subtle: #858C7E; --placeholder: #7D8476; --muted: #A3AA9B; --fg: #EEF1EA; --fg-strong: #FFFFFF; --up: #4BD17A; --down: #FF7A57; --warn: #F2C14E; --meme: #B4A2FF; --up-bg: #12281A; --up-bg-2: #0F1D13; --up-track: #1F3A27; --down-bg: #2E1710; --meme-bg: #231D3A; --inv-bg: #EEF1EA; --inv-fg: #0B0C0A; --inv-hover: #FFFFFF; color-scheme: dark; }
    .pp.theme-dark .dark { box-shadow: inset 0 0 0 1px #22261E; }
    .theme-toggle:hover { border-color: var(--line-strong) !important; }
    body { margin: 0; background: var(--surface); color: var(--fg); font-family: "Schibsted Grotesk", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; } a:hover { color: var(--fg-strong); }
    button { font-family: inherit; cursor: pointer; }
    input { font-family: inherit; }
    input::placeholder { color: var(--placeholder); }
    .row:hover { background: var(--hover); }
    .navlink:hover { color: var(--fg); }
    .navsearch:hover { border-color: var(--line-strong) !important; color: var(--fg) !important; }
    .chip:hover { background: var(--muted-bg-2); }
    .card:hover { border-color: var(--line-strong-2); }
  </style>
</helmet>
<div class="{{themeClass}}" style="width: 1440px; height: 1440px; box-sizing: border-box; background: var(--surface); display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 40px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 40px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px;">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect style="fill: {{accent}};" x="2" y="9" width="26" height="12" rx="6"></rect><circle cx="9" cy="15" r="3" style="fill: var(--surface);"></circle><circle cx="15" cy="15" r="3" style="fill: var(--surface);"></circle><circle cx="21" cy="15" r="3" style="fill: var(--surface);"></circle></svg>
      <span style="font-size: 21px; font-weight: 700; letter-spacing: -0.02em;">Peapod</span>
    </a>
    <nav style="display: flex; align-items: center; gap: 28px; font-size: 15px; font-weight: 500;">
      <a href="Main.dc.html" style="color: var(--fg); font-weight: 600;">Leaderboard</a>
      <a class="navlink" href="CopyTrade.dc.html" style="color: var(--muted);">Copy trade</a>
      <a class="navlink" href="#" style="color: var(--muted);">Markets</a>    </nav>
    <button class="navsearch" onClick="{{openSearch}}" aria-label="Search assets or addresses" style="width: 400px; height: 44px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; text-align: left;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="flex-grow: 1; white-space: nowrap;">Search assets, addresses or names</span>
      <span style="height: 24px; min-width: 24px; box-sizing: border-box; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: center;">/</span>
    </button>
    <div style="flex-grow: 1;"></div>
    <button class="theme-toggle" onClick="{{toggleTheme}}" aria-label="{{themeAria}}" title="{{themeAria}}" style="width: 84px; height: 44px; flex-shrink: 0; box-sizing: border-box; padding: 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--muted-bg); display: flex; align-items: center; justify-content: space-between;">
      <span style="{{sunStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor; stroke: currentColor;"><circle cx="12" cy="12" r="4.5" stroke="none"></circle><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7" fill="none" stroke-width="2.2" stroke-linecap="round"></path></svg></span>
      <span style="{{moonStyle}}"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor;"><path d="M20.6 14.3A8.6 8.6 0 1 1 9.7 3.4a7 7 0 0 0 10.9 10.9z"></path></svg></span>
    </button>
    <button style="height: 44px; padding: 0 24px; border-radius: 10px; border: 0; background: var(--inv-bg); color: var(--inv-fg); font-size: 15px; font-weight: 600;">Connect wallet</button>
  </header>

  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 40px 40px 32px; display: flex; flex-direction: column; gap: 0;">

    <section style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px;">
      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 60px; line-height: 1; letter-spacing: -0.015em;">Traders leaderboard by realized PnL</h1>
      <p style="margin: 0; font-size: 18px; color: var(--muted);">Top traders on Robinhood Chain across every market and timeframe, ranked by net realized performance.</p>
    </section>

    <section style="height: 56px; flex-shrink: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 4px;">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
          <button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--muted-bg);">
          <sc-for list="{{ranges}}" as="r" hint-placeholder-count="5">
            <button onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--muted-bg);">
          <sc-for list="{{units}}" as="u" hint-placeholder-count="2">
            <button onClick="{{u.pick}}" aria-label="{{u.aria}}" style="{{u.style}}">{{u.label}}</button>
          </sc-for>
        </div>
        <button class="chip" aria-label="Filters" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M7 12h10"></path><path d="M10 18h4"></path></svg>
        </button>
        <div style="width: 260px; height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 8px;">
          <svg style="stroke: var(--muted);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input type="search" aria-label="Search traders" placeholder="Search address or .rh name" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--fg); font-size: 14px;">
        </div>
      </div>
    </section>

    <section style="display: flex; gap: 8px; padding: 16px 0 24px;">
      <sc-for list="{{chips}}" as="f" hint-placeholder-count="4">
        <button class="chip" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
          {{f.label}}
          <svg style="stroke: var(--muted);" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </sc-for>
    </section>

    <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-bottom: 24px;">
      <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
        <button class="card" onClick="{{p.open}}" style="height: 300px; box-sizing: border-box; padding: 0; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; text-align: left; display: flex; flex-direction: column; overflow: hidden;">
          <div style="height: 84px; flex-shrink: 0; box-sizing: border-box; padding: 0 22px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 14px;">
            <div style="{{p.avatarStyle}}">{{p.initials}}</div>
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
              <div style="font-size: 17px; font-weight: 600;">{{p.name}}</div>
              <div style="display: flex;">
                <sc-for list="{{p.assets}}" as="a" hint-placeholder-count="2">
                  <div style="{{a.style}}">{{a.t}}</div>
                </sc-for>
              </div>
            </div>
            <div style="{{p.medalStyle}}">{{p.rank}}</div>
          </div>
          <div style="flex-grow: 1; box-sizing: border-box; padding: 20px 22px; display: flex; gap: 16px;">
            <div style="width: 150px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px;">
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500; color: var(--up);">{{p.pnl}}</div>
                <div style="font-size: 13px; color: var(--muted);">{{p.pnlLabel}}</div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500;">{{p.acct}}</div>
                <div style="font-size: 13px; color: var(--muted);">Account value</div>
              </div>
            </div>
            <svg width="100%" height="176" viewBox="0 0 240 176" preserveAspectRatio="none" style="flex-grow: 1; min-width: 0; display: block;" aria-hidden="true">
              <defs>
                <pattern id="{{p.patId}}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                  <line style="stroke: {{accent}};" x1="0" y1="0" x2="0" y2="6" stroke-width="1" stroke-opacity="0.22"></line>
                </pattern>
              </defs>
              <line style="stroke: var(--line-strong);" x1="0" y1="8" x2="240" y2="8" stroke-width="1" stroke-dasharray="2 4"></line>
              <path style="fill: {{p.patUrl}};" d="{{p.area}}"></path>
              <path style="stroke: {{accent}};" d="{{p.line}}" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
              <circle style="fill: {{accent}};" cx="236" cy="{{p.endY}}" r="4"></circle>
            </svg>
          </div>
        </button>
      </sc-for>
    </section>

    <section style="flex-grow: 1; min-height: 0; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; overflow: hidden;">
      <div style="height: 48px; flex-shrink: 0; box-sizing: border-box; padding: 0 22px; border-bottom: 1px solid var(--line); background: var(--surface-2); display: grid; grid-template-columns: 64px minmax(0, 1.6fr) repeat(5, minmax(0, 1fr)) 150px; column-gap: 16px; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);">
        <div>Rank</div>
        <div>Trader</div>
        <sc-for list="{{heads}}" as="h" hint-placeholder-count="5">
          <button onClick="{{h.pick}}" style="{{h.style}}">
            {{h.label}}
            <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><path style="stroke: {{h.upColor}};" d="M1.5 5L5 1.5 8.5 5" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path style="stroke: {{h.downColor}};" d="M1.5 9L5 12.5 8.5 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
        </sc-for>
        <div>Top assets</div>
      </div>
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="9">
        <button class="row" onClick="{{row.open}}" style="width: 100%; height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 22px; border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; color: var(--fg); font: inherit; text-align: left; display: grid; grid-template-columns: 64px minmax(0, 1.6fr) repeat(5, minmax(0, 1fr)) 150px; column-gap: 16px; align-items: center; font-size: 15px;">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--muted);">{{row.rank}}</div>
          <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
            <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--hover); color: var(--muted); display: flex; align-items: center; justify-content: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
            </div>
            <div style="font-weight: 600;">{{row.name}}</div>
          </div>
          <div style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 14px;">{{row.acct}}</div>
          <div style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--up);">{{row.pnl}}</div>
          <div style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 14px;">{{row.vol}}</div>
          <div style="{{row.winStyle}}">{{row.win}}</div>
          <div style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 14px;">{{row.trades}}</div>
          <div style="display: flex;">
            <sc-for list="{{row.assets}}" as="a" hint-placeholder-count="3">
              <div style="{{a.style}}">{{a.t}}</div>
            </sc-for>
          </div>
        </button>
      </sc-for>
    </section>
  </main>

  <footer style="height: 48px; flex-shrink: 0; box-sizing: border-box; padding: 0 40px; border-top: 1px solid var(--line); background: var(--surface-2); display: flex; align-items: center; gap: 20px; font-size: 13px;">
    <div style="display: flex; align-items: center; gap: 8px; color: var(--up); font-weight: 600;">
      <div style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}};"></div>
      Connected
    </div>
    <div style="width: 1px; height: 20px; background: var(--line);"></div>
    <div style="display: flex; align-items: center; gap: 18px;">
      <sc-for list="{{tape}}" as="t" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-weight: 600;">{{t.sym}}</span>
          <span style="{{t.style}}">{{t.px}}</span>
          <svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path style="fill: {{t.color}};" d="{{t.tri}}"></path></svg>
        </div>
      </sc-for>
    </div>
    <div style="flex-grow: 1;"></div>
    <a href="#" style="display: flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 500;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Send feedback
    </a>
  </footer>

  <sc-if value="{{isOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; z-index: 55; top: 0; right: 0; bottom: 0; left: 0; background: rgba(17, 20, 15, 0.32);">
      <button aria-label="Close trader profile" onClick="{{close}}" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: default;"></button>
      <div style="position: absolute; top: 30px; left: 20px;">
        <dc-import name="TraderModal" trader="{{sel}}" on-close="{{close}}" theme="{{theme}}" on-toggle-theme="{{setTheme}}" accent="{{accent}}" hint-size="1400px,1380px"></dc-import>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isAsset}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; z-index: 52; top: 0; right: 0; bottom: 0; left: 0; background: rgba(11, 12, 10, 0.45); backdrop-filter: blur(2px);">
      <button aria-label="Close asset view" onClick="{{closeAsset}}" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: default;"></button>
      <div style="position: absolute; top: 30px; left: 20px;">
        <dc-import name="AssetHolders" asset="{{assetSel}}" on-close="{{closeAsset}}" on-open-trader="{{openTraderFromSearch}}" theme="{{theme}}" on-toggle-theme="{{setTheme}}" accent="{{accent}}" hint-size="1400px,1380px"></dc-import>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isSearch}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; z-index: 60; top: 0; right: 0; bottom: 0; left: 0; background: rgba(11, 12, 10, 0.5); backdrop-filter: blur(3px);">
      <button aria-label="Close search" onClick="{{closeSearch}}" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: default;"></button>
      <div style="position: absolute; top: 96px; left: 290px;">
        <dc-import name="SearchPalette" on-close="{{closeSearch}}" on-open-trader="{{openTraderFromSearch}}" on-open-asset="{{openAssetFromSearch}}" theme="{{theme}}" on-toggle-theme="{{setTheme}}" accent="{{accent}}" hint-size="860px,600px"></dc-import>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"defaultTheme":{"editor":"enum","options":["light","dark"],"default":"light"},"accent":{"editor":"color","default":"#00B843","options":["#00B843","#11140F","#2F6BFF","#E8A400"]},"$preview":{"width":1440,"height":1440}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { range: '30D', cat: 'all', unit: 'usd', sort: 'pnl', open: null };
    let savedTheme = null;
    try { savedTheme = window.localStorage.getItem('peapod-theme'); } catch (e) { savedTheme = null; }
    this.state.theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (props.defaultTheme === 'dark' ? 'dark' : 'light');
  }
  componentDidMount() {
    this._onThemeStore = (e) => {
      if (e.key === 'peapod-theme' && (e.newValue === 'dark' || e.newValue === 'light')) this.setState({ theme: e.newValue });
    };
    window.addEventListener('storage', this._onThemeStore);
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this._onThemeStore);
  }
  themeVals() {
    const theme = this.props.theme === 'dark' || this.props.theme === 'light' ? this.props.theme : this.state.theme;
    const isDark = theme === 'dark';
    const toggleTheme = () => {
      const next = isDark ? 'light' : 'dark';
      try { window.localStorage.setItem('peapod-theme', next); } catch (e) { /* storage unavailable */ }
      if (this.props.onToggleTheme) this.props.onToggleTheme(next);
      else this.setState({ theme: next });
    };
    const slot = 'width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: background-color 200ms ease, color 200ms ease; ';
    return {
      theme, isDark, toggleTheme,
      setTheme: (next) => this.setState({ theme: next }),
      themeClass: isDark ? 'pp theme-dark' : 'pp',
      themeAria: isDark ? 'Switch to day mode' : 'Switch to night mode',
      sunStyle: slot + (isDark ? 'background: transparent; color: #6E7567;' : 'background: #F4EFE3; color: #1E4D2B; box-shadow: 0 1px 3px rgba(17,20,15,0.18);'),
      moonStyle: slot + (isDark ? 'background: #0B0C0A; color: #EFE6C8; box-shadow: 0 0 0 1px #2E3329;' : 'background: transparent; color: #8A9082;')
    };
  }
  searchVals() {
    return {
      isSearch: !!this.state.search, isAsset: !!this.state.asset, assetSel: this.state.asset,
      openSearch: () => this.setState({ search: true }),
      closeSearch: () => this.setState({ search: false }),
      openAssetFromSearch: (a) => this.setState({ search: false, asset: a, open: null }),
      closeAsset: () => this.setState({ asset: null }),
      openTraderFromSearch: (t) => this.setState({ search: false, open: t })
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#00B843';
    const upText = 'var(--up)';
    const downText = 'var(--down)';
    const warnText = 'var(--warn)';
    const { range, cat, unit, sort } = this.state;
    const mult = { '24H': 0.05, '7D': 0.31, '30D': 1, 'YTD': 2.1, 'All time': 2.8 }[range];

    const full = (v) => '$' + Math.round(Math.abs(v)).toLocaleString('en-US');
    const cents = (v) => '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const assetSyms = { T: 'TSLA', N: 'NVDA', H: 'HOOD', A: 'AAPL', S: 'SPY', G: 'GLD', E: 'ROBIN', B: 'SQUAWK', P: 'FEATHER', W: 'WORM', K: 'NEST' };
    const assetColors = { T: '#D9E4FF', N: '#DDF5D6', H: '#D8F7E4', A: '#EEEEEE', S: '#FFE0DA', G: '#F7F0C9', E: '#EBE4FF', B: '#FFE1F1', P: '#E4DCFF', W: '#F3E8FF', K: '#FFF1CC' };
    const dot = (k, i) => ({ t: (assetSyms[k] || k).charAt(0), style: 'width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; border: 2px solid var(--surface); margin-left: ' + (i ? '-6px' : '0') + '; background: ' + (assetColors[k] || '#EEEEEE') + '; color: #0A0B09; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;' });

    const traders = [
      { name: 'pea_whale', pnl: 1284390.42, roi: 212.4, vol: 48204118, acct: 2410552, win: 64.2, trades: 412, assets: 'TNE', cat: 'stocks', seed: 11 },
      { name: '0x19bd…04af', pnl: 902115.08, roi: 88.1, vol: 31702440, acct: 1930871, win: 58.0, trades: 97, assets: 'EPW', cat: 'memes', seed: 23 },
      { name: 'thetaGang', pnl: 641208.77, roi: 140.9, vol: 22011930, acct: 0, win: 61.4, trades: 38, assets: 'NH', cat: 'stocks', seed: 37 },
      { name: '0x5510…ad3c', pnl: 488760.15, roi: 47.3, vol: 40519002, acct: 1520330, win: 52.1, trades: 590, assets: 'TNEAB', cat: 'stocks', seed: 41 },
      { name: 'nvda_maxi', pnl: 402033.64, roi: 95.6, vol: 12803577, acct: 840112, win: 100.0, trades: 3, assets: 'N', cat: 'stocks', seed: 53 },
      { name: '0x3c9a…e5d8', pnl: 311480.29, roi: 33.0, vol: 18904721, acct: 1250004, win: 47.7, trades: 44, assets: 'EBK', cat: 'memes', seed: 67 },
      { name: 'slowbid', pnl: 276912.51, roi: 61.2, vol: 9402286, acct: 17, win: 72.7, trades: 11, assets: 'SG', cat: 'stocks', seed: 71 },
      { name: 'delta0', pnl: 198305.93, roi: 21.7, vol: 27109954, acct: 1110870, win: 49.3, trades: 259, assets: 'TNHA', cat: 'stocks', seed: 83 },
      { name: '0xf2a4…6e1b', pnl: 154870.22, roi: 44.8, vol: 6203318, acct: 500216, win: 100.0, trades: 2, assets: 'BW', cat: 'memes', seed: 97 },
      { name: 'ghostfill', pnl: 121044.80, roi: 18.2, vol: 14618775, acct: 790442, win: 69.5, trades: 59, assets: 'TEBS', cat: 'stocks', seed: 101 },
      { name: '0x0d6e…b3a9', pnl: 98740.36, roi: 12.9, vol: 8841002, acct: 612998, win: 55.0, trades: 20, assets: 'GS', cat: 'stocks', seed: 109 },
      { name: 'rh_degen', pnl: 87311.07, roi: 30.4, vol: 5120449, acct: 0, win: 48.0, trades: 25, assets: 'TAHE', cat: 'stocks', seed: 113 }
    ];

    const hex = (s, len) => { let x = s * 131 + 7, out = ''; for (let i = 0; i < len; i++) { x = (x * 9301 + 49297) % 233280; out += '0123456789abcdef'[Math.floor(x / 233280 * 16)]; } return out; };
    traders.forEach((t) => {
      t.addr = t.name.indexOf('0x') === 0
        ? t.name.slice(0, 6) + hex(t.seed, 30) + t.name.slice(-4)
        : '0x' + hex(t.seed, 38);
    });
    const openFor = (t, rank) => () => this.setState({ open: Object.assign({}, t, { rank }) });
    const close = () => this.setState({ open: null });

    const pool = traders.filter((t) => cat === 'all' || t.cat === cat);
    const keyOf = { acct: (t) => t.acct, pnl: (t) => (unit === 'pct' ? t.roi : t.pnl), vol: (t) => t.vol, win: (t) => t.win, trades: (t) => t.trades };
    const byPnl = pool.slice().sort((a, b) => keyOf.pnl(b) - keyOf.pnl(a));
    const top = byPnl.slice(0, 3);
    const rest = byPnl.slice(3).sort((a, b) => keyOf[sort](b) - keyOf[sort](a));

    const pnlText = (t) => unit === 'pct' ? '+' + (t.roi * mult).toFixed(2) + '%' : '+' + cents(t.pnl * mult);

    const curve = (seed) => {
      let x = seed, v = 0;
      const vals = [];
      for (let i = 0; i < 48; i++) {
        x = (x * 9301 + 49297) % 233280;
        const r = x / 233280;
        const jump = (i > 14 && i < 24) ? r * 14 : (r - 0.35) * 1.6;
        v += jump;
        vals.push(v);
      }
      const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
      const pts = vals.map((y, i) => [(4 + i * 232 / 47).toFixed(1), (170 - ((y - min) / (max - min || 1)) * 158).toFixed(1)]);
      const line = 'M' + pts.map((p) => p.join(',')).join(' L');
      return { line, area: line + ' L236,176 L4,176 Z', endY: pts[pts.length - 1][1] };
    };

    const medal = ['#B98900', '#7C848C', '#A35F2A'];
    const medalBg = ['#FFF6D6', '#F0F2F4', '#FBEBDD'];
    const podium = top.map((t, i) => {
      const c = curve(t.seed);
      return {
        name: t.name,
        rank: String(i + 1),
        open: openFor(t, i + 1),
        initials: t.name.replace('0x', '').slice(0, 2).toUpperCase(),
        avatarStyle: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; ' + (i === 0 ? 'background: ' + accent + '; color: #FFFFFF;' : 'background: var(--muted-bg); color: var(--fg); border: 1px solid var(--line); box-sizing: border-box;'),
        medalStyle: 'width: 48px; height: 48px; flex-shrink: 0; box-sizing: border-box; border-radius: 24px; border: 2px solid ' + medal[i] + '; background: ' + medalBg[i] + '; color: ' + medal[i] + '; font-family: "Instrument Serif", Georgia, serif; font-size: 28px; font-style: italic; display: flex; align-items: center; justify-content: center;',
        assets: t.assets.split('').map(dot),
        pnl: pnlText(t),
        pnlLabel: unit === 'pct' ? 'Net ROI' : 'Net PnL',
        acct: full(t.acct),
        patId: 'hatch' + i,
        patUrl: 'url(#hatch' + i + ')',
        line: c.line, area: c.area, endY: c.endY
      };
    });

    const rows = rest.map((t, i) => ({
      rank: String(i + 4),
      open: openFor(t, i + 4),
      name: t.name,
      acct: full(t.acct),
      pnl: pnlText(t),
      vol: full(t.vol * mult),
      win: t.win.toFixed(1) + '%',
      winStyle: 'text-align: right; font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 500; color: ' + (t.win >= 60 ? upText : t.win >= 50 ? warnText : downText) + ';',
      trades: String(Math.max(1, Math.round(t.trades * Math.min(mult, 1.5)))),
      assets: t.assets.split('').map(dot)
    }));

    const cats = [['all', 'Overall'], ['stocks', 'Stocks'], ['memes', 'Memecoins']].map(([id, label]) => ({
      label,
      pick: () => this.setState({ cat: id }),
      style: 'height: 36px; padding: 0 14px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; ' + (id === cat ? 'background: var(--inv-bg); color: var(--inv-fg);' : 'background: transparent; color: var(--muted);')
    }));

    const ranges = ['24H', '7D', '30D', 'YTD', 'All time'].map((label) => ({
      label,
      pick: () => this.setState({ range: label }),
      style: 'height: 34px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; ' + (label === range ? 'background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(17,20,15,0.12);' : 'background: transparent; color: var(--muted);')
    }));

    const units = [['usd', '$', 'Show PnL in dollars'], ['pct', '%', 'Show PnL as percent']].map(([id, label, aria]) => ({
      label, aria,
      pick: () => this.setState({ unit: id }),
      style: 'width: 34px; height: 34px; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; ' + (id === unit ? 'background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(17,20,15,0.12);' : 'background: transparent; color: var(--muted);')
    }));

    const chips = [{ label: 'All assets' }, { label: 'Account value' }, { label: 'Win rate' }, { label: 'All styles' }];

    const heads = [['acct', 'Account value'], ['pnl', unit === 'pct' ? 'Net ROI' : 'Net PnL'], ['vol', 'Volume'], ['win', 'Win rate'], ['trades', 'Trades']].map(([id, label]) => ({
      label,
      pick: () => this.setState({ sort: id }),
      upColor: 'var(--faint)',
      downColor: id === sort ? 'var(--fg)' : 'var(--faint)',
      style: 'height: 44px; padding: 0; border: 0; background: transparent; font: inherit; letter-spacing: inherit; text-transform: inherit; display: flex; align-items: center; justify-content: flex-end; gap: 6px; color: ' + (id === sort ? 'var(--fg)' : 'var(--muted)') + ';'
    }));

    const tk = (sym, px, up) => ({
      sym, px,
      color: up ? upText : downText,
      style: 'font-family: "JetBrains Mono", monospace; color: ' + (up ? upText : downText) + ';',
      tri: up ? 'M4 1L7.5 7H0.5Z' : 'M4 7L0.5 1H7.5Z'
    });
    const tape = [
      tk('SPY', '$662.10', false), tk('TSLA', '$342.18', true), tk('NVDA', '$186.05', true),
      tk('HOOD', '$118.37', true), tk('AAPL', '$238.92', false), tk('ROBIN', '$0.004182', true), tk('SQUAWK', '$0.0000871', false)
    ];

    return Object.assign(this.themeVals(), this.searchVals(), { accent, cats, ranges, units, chips, heads, podium, rows, tape, close, sel: this.state.open, isOpen: !!this.state.open });
  }
}
</script>
