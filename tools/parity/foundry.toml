# No absolute paths live here. Remappings are resolved at run time by ./generate.sh
# from the PEAPOD_LP_TERMINAL environment variable and passed to forge on the command
# line, so this file stays valid wherever either repository is checked out.
#
# Run `./generate.sh`, not `forge test` directly — a bare `forge test` has no remappings
# and will fail to resolve the v4-core imports.

[profile.default]
src = "src"
out = "out"
test = "test"
solc = "0.8.26"
evm_version = "cancun"
fs_permissions = [{ access = "write", path = "./" }]
