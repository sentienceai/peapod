<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>peapod — what a position would have earned</title>
<meta name="description" content="What providing liquidity to a tokenized-stock pool on Robinhood Chain would have earned against simply holding the two tokens, across every historical window.">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&display=swap">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/app.css">
<script type="module" src="/calc.js"></script>
</head>
<body>
<a class="skip" href="#result">Skip to the result</a>

<div class="shell">
  <header class="masthead">
    <h1 class="wordmark">peapod</h1>
    <p class="masthead-sub">What a position would have earned, against just holding.</p>
    <nav class="masthead-nav" aria-label="Sections">
      <a href="/">Depth</a>
      <a href="/calculator.html" aria-current="page">Calculator</a>
    </nav>
  </header>

  <div class="provenance" id="provenance" aria-label="How and when this was measured"></div>

  <main class="calc-grid">
    <form class="controls" id="controls" aria-label="Position">
      <div class="field">
        <label class="field-label" for="pool">Pool</label>
        <select id="pool"></select>
      </div>
      <div class="field">
        <label class="field-label" for="range">Price range, either side</label>
        <input id="range" type="number" min="1" max="90" step="1" value="10" inputmode="decimal">
      </div>
      <p class="snap-note" id="snap" hidden></p>
      <div class="field">
        <label class="field-label" for="days">Held for</label>
        <select id="days"></select>
      </div>
      <div class="field">
        <label class="field-label" for="size">Amount</label>
        <input id="size" type="number" min="100" max="10000000" step="100" value="25000" inputmode="decimal">
      </div>
    </form>

    <section id="result" aria-live="polite" aria-labelledby="result-head">
      <div class="section-head">
        <h2 id="result-head">Every window this position could have run</h2>
        <p class="section-note" id="result-note"></p>
      </div>
      <div id="result-body"></div>
    </section>
  </main>

  <section class="section" aria-labelledby="calc-method-head">
    <div class="section-head"><h2 id="calc-method-head">How this is worked out</h2></div>
    <div class="prose" id="method-body"></div>
  </section>

  <footer class="footer">
    <p id="footer-note"></p>
  </footer>
</div>
</body>
</html>
