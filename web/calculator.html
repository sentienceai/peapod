<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>peapod — LP calculator</title>
<meta name="description" content="Fees minus impermanent loss versus holding, for a pool, a range and a position size on Robinhood Chain. Shows the distribution across historical windows, not a point estimate.">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/app.css">
<script type="module" src="/calc.js"></script>
</head>
<body>
<a class="skip" href="#result">Skip to the result</a>

<div class="shell">
  <header class="masthead">
    <h1 class="wordmark">peapod</h1>
    <p class="masthead-sub">Fees minus impermanent loss, against holding</p>
    <nav class="masthead-nav" aria-label="Sections">
      <a href="/">Depth</a>
      <a href="/calculator.html" aria-current="page">Calculator</a>
    </nav>
  </header>

  <div class="provenance" id="provenance" aria-label="How and when this was measured"></div>

  <main class="calc-grid">
    <form class="controls" id="controls" aria-label="Position">
      <div class="field">
        <label class="field-label" for="pool">Pool</label>
        <select id="pool"></select>
      </div>

      <div class="field">
        <label class="field-label" for="range">Range, either side of the price</label>
        <input id="range" type="number" min="1" max="90" step="1" value="10" inputmode="decimal">
      </div>

      <p class="snap-note" id="snap" hidden></p>

      <div class="field">
        <label class="field-label" for="days">Holding period</label>
        <select id="days"></select>
      </div>

      <div class="field">
        <label class="field-label" for="size">Position size</label>
        <input id="size" type="number" min="100" max="10000000" step="100" value="25000" inputmode="decimal">
      </div>
    </form>

    <section id="result" aria-live="polite" aria-labelledby="result-head">
      <div class="section-head">
        <h2 id="result-head">Net versus holding</h2>
        <p class="section-note" id="result-note"></p>
      </div>
      <div id="result-body"></div>
    </section>
  </main>

  <section class="method" aria-labelledby="calc-method-head">
    <div class="section-head">
      <h2 id="calc-method-head">How this is computed</h2>
    </div>
    <div class="method-body" id="method-body"></div>
  </section>

  <footer class="footer">
    <p id="footer-note"></p>
  </footer>
</div>
</body>
</html>
