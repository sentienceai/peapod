<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>peapod — executable depth on Robinhood Chain</title>
<meta name="description" content="Real executable ±1% depth for tokenized equity pools on Robinhood Chain, measured by walking the tick liquidity map. Not TVL.">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#depth">Skip to the depth table</a>

<div class="shell">
  <header class="masthead">
    <h1 class="wordmark">peapod</h1>
    <p class="masthead-sub">Executable &plusmn;1% depth on Robinhood Chain</p>
    <nav class="masthead-nav" aria-label="Sections">
      <a href="/" aria-current="page">Depth</a>
      <a href="/calculator.html">Calculator</a>
    </nav>
  </header>

  <div class="provenance" id="provenance" aria-label="How and when this was measured"></div>

  <main>
    <section class="hero" aria-labelledby="finding">
      <h2 class="hero-head" id="finding">One pool holds three quarters of it.</h2>
      <div class="band" id="band" role="img" aria-describedby="band-note"></div>
      <div class="band-scale" id="band-scale" aria-hidden="true"></div>
      <p class="hero-note" id="band-note"></p>
    </section>

    <section class="section" id="depth" aria-labelledby="depth-head">
      <div class="section-head">
        <h2 id="depth-head">Every pool</h2>
        <p class="section-note" id="depth-note"></p>
      </div>
      <div class="table-wrap">
        <table class="depth">
          <caption id="depth-caption"></caption>
          <thead>
            <tr>
              <th scope="col" class="rank">#</th>
              <th scope="col">Pool</th>
              <th scope="col" id="ruler-head">Executable &plusmn;1%</th>
              <th scope="col" class="num">vs flat</th>
              <th scope="col" class="num">7-day median</th>
              <th scope="col" class="num">% of median</th>
              <th scope="col" class="num">Volume/day</th>
            </tr>
          </thead>
          <tbody id="depth-body"></tbody>
        </table>
      </div>
    </section>

    <section class="method" aria-labelledby="method-head">
      <div class="section-head">
        <h2 id="method-head">What changed, and why</h2>
      </div>
      <div id="restatements"></div>
      <div class="method-body" id="method-body"></div>
    </section>
  </main>

  <footer class="footer">
    <p id="footer-note"></p>
  </footer>
</div>
</body>
</html>
