<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>peapod — traders by realized PnL</title>
<meta name="description" content="Traders on Robinhood Chain ranked by realized profit on completed round-trips: bought and sold on-chain.">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/app.css">
<script type="module" src="/index.js"></script>
</head>
<body>
<a class="skip" href="#board">Skip to the ranking</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><i></i>peapod</a>
    <nav class="topnav" aria-label="Main">
      <a href="/" aria-current="page">Leaderboard</a>
      <a href="/traders">Traders</a>
    </nav>
    <span class="spacer"></span>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="search" type="search" placeholder="Search address…" aria-label="Search address">
    </label>
  </div>
</header>

<div class="shell">
  <div class="page-head">
    <h1>Traders by realized PnL</h1>
    <p class="caveat" id="caveat"></p>
  </div>

  <div class="controls">
    <div class="tabset" id="categories" role="tablist" aria-label="Token category"></div>
    <span class="divider"></span>
    <div class="tabset" id="quotes" role="tablist" aria-label="Quote asset"></div>
    <span class="spacer"></span>
    <div class="tabset tabset--segmented" id="windows" role="tablist" aria-label="Timeframe"></div>
    <div class="toggle" id="unit" role="group" aria-label="Show as dollars or percent">
      <button type="button" data-unit="abs" aria-pressed="true">$</button>
      <button type="button" data-unit="pct" aria-pressed="false">%</button>
    </div>
  </div>

  <div class="pills">
    <label class="pill">Min round-trips
      <select id="min-trips">
        <option value="1">1</option><option value="5">5</option>
        <option value="10">10</option><option value="25">25</option>
      </select>
    </label>
    <label class="pill">Min win rate
      <select id="min-win">
        <option value="0">any</option><option value="50">50%</option>
        <option value="60">60%</option><option value="75">75%</option>
      </select>
    </label>
  </div>

  <section class="podium" id="podium" aria-label="Top three"></section>

  <div class="table-wrap" id="board">
    <table class="board">
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No address matches these filters.</p>
  </div>

  <div class="footnote" id="footnote"></div>
</div>

<div class="modal-backdrop" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-addr">
  <div class="modal">
    <div class="modal-head">
      <span class="crumb">Leaderboard /</span>
      <span class="who-addr" id="modal-addr"></span>
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <aside class="rail" id="rail"></aside>
      <div class="pane">
        <div class="metric-grid" id="metrics"></div>
        <div class="chartcard">
          <div class="chartcard-head">
            <h5>Cumulative realized</h5>
            <strong id="chart-total"></strong>
            <span class="spacer"></span>
            <div class="tabset tabset--segmented" id="chart-range" role="tablist" aria-label="Chart range"></div>
          </div>
          <div class="chart-stage" id="chart-stage">
            <div class="tip" id="tip" hidden></div>
          </div>
        </div>
        <div class="subtabs" id="subtabs" role="tablist"></div>
        <div class="scroller" id="subtable"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
